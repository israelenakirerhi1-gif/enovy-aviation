<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up — ENOVY Air</title>
<meta name="description" content="Create your ENOVY Air account.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header>
  <div class="wrap nav">
    <a href="index.html" class="logo">
      <span class="mark">E</span>
      <span class="name">ENOVY AIR<small>ENOVY GLOBAL LTD</small></span>
    </a>
    <nav class="navlinks">
      <a href="index.html">Book a Flight</a>
      <a href="flights.html">Flights</a>
      <a href="dashboard.html">My Bookings</a>
    </nav>
    <div class="nav-right" id="navRight"></div>
  </div>
</header>

<section>
  <div class="wrap">
    <div class="auth-wrap reveal">
      <h1>Create your account</h1>
      <p class="sub">Sign up to book flights and track your bookings.</p>
      <div class="form-error" id="formError"></div>
      <form id="registerForm">
        <div class="field" style="margin-bottom:14px;"><label>Full name</label><input type="text" id="name" required></div>
        <div class="field" style="margin-bottom:14px;"><label>Email</label><input type="email" id="email" required></div>
        <div class="field" style="margin-bottom:20px;"><label>Password</label><input type="password" id="password" minlength="6" required></div>
        <button class="btn btn-primary btn-block" type="submit">Create Account</button>
      </form>
      <div class="auth-switch">Already have an account? <a href="login.html">Log in</a></div>
    </div>
  </div>
</section>
<footer>
  <div class="wrap foot-bottom">
    <span>&copy; 2026 ENOVY GLOBAL LTD &middot; ENOVY Air &middot; CEO: Mr Ovie Enakirerhi</span>
    <span>Warri, Delta State, Nigeria</span>
  </div>
</footer>
<div class="toast" id="toast"></div>
<script src="assets/app.js"></script><script src="assets/page-register.js"></script>
<script src="assets/chatbot.js"></script>
</body>
</html>
